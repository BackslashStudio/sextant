name: CI

on:
  push:
    paths-ignore: ['README.md', 'doc/**', 'LICENSE', 'THIRD_PARTY_NOTICES.md']
  pull_request:
    paths-ignore: ['README.md', 'doc/**', 'LICENSE', 'THIRD_PARTY_NOTICES.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # `experimental: true` lets a platform being brought up run for the log
    # without failing the workflow. None is today: macOS stopped being one at
    # v1.0 step 21.6, and every job here is a gate.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-2025
            experimental: false
          - name: Linux GCC
            os: ubuntu-24.04
            experimental: false
            poison: true
          - name: Linux Clang libc++
            os: ubuntu-24.04
            experimental: false
            cc: clang
            cxx: clang++
            stdlib: -stdlib=libc++
          - name: macOS arm64
            os: macos-15
            experimental: false

    defaults:
      run:
        shell: bash

    # Mesa's software rasteriser. On Windows it would otherwise pick its D3D12
    # driver over WARP, which breaks depth peeling; Linux uses it already.
    env:
      GALLIUM_DRIVER: llvmpipe

    steps:
      - uses: actions/checkout@v7

      # --- Dependencies -----------------------------------------------------

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libfreetype-dev libpng-dev libgl-dev libgl1-mesa-dri \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            xvfb xauth fonts-dejavu-core fonts-liberation
          if [ -n "${{ matrix.stdlib }}" ]; then
            sudo apt-get install -y --no-install-recommends clang libc++-dev libc++abi-dev
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja freetype libpng

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # The runners have no GPU; Windows' own opengl32 stops at GL 1.1.
      - name: Install Mesa llvmpipe (Windows)
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@v3

      - name: Point vcpkg at a cached binary dir (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p vcpkg-bincache
          echo "VCPKG_DEFAULT_BINARY_CACHE=$(cygpath -w "$PWD/vcpkg-bincache")" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ runner.os }}-static-md-${{ github.run_id }}
          restore-keys: vcpkg-${{ runner.os }}-static-md-

      # Static-md, as CMakeLists.txt defaults to on Windows: FreeType/libpng
      # link into sextant.dll.
      - name: Install FreeType and libpng (Windows)
        if: runner.os == 'Windows'
        run: |
          "$(cygpath -u "$VCPKG_INSTALLATION_ROOT")/vcpkg" install \
            freetype:x64-windows-static-md libpng:x64-windows-static-md zlib:x64-windows-static-md

      # --- Configure and build ----------------------------------------------

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          args=(-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSEXTANT_BUILD_TESTS=ON)
          if [ "$RUNNER_OS" = Windows ]; then
            args+=("-DCMAKE_TOOLCHAIN_FILE=$(cygpath -m "$VCPKG_INSTALLATION_ROOT")/scripts/buildsystems/vcpkg.cmake")
          fi
          if [ -n "${{ matrix.stdlib }}" ]; then
            args+=("-DCMAKE_CXX_FLAGS=${{ matrix.stdlib }}"
                   "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.stdlib }}"
                   "-DCMAKE_SHARED_LINKER_FLAGS=${{ matrix.stdlib }}")
          fi
          # Kept, so the macOS dylib check can read what was decided about
          # linking FreeType and libpng statically rather than guess.
          cmake "${args[@]}" 2>&1 | tee configure.txt

      # gl_probe needs only GLFW, so it is built and run before the library:
      # it reports the runner's OpenGL even where sextant does not build.
      - name: Build gl_probe
        run: cmake --build build --target sextant_gl_probe

      - name: Run gl_probe
        continue-on-error: ${{ matrix.experimental }}
        run: |
          mkdir -p out && cd out
          wrap=()
          if [ "$RUNNER_OS" = Linux ]; then wrap=(xvfb-run -a -s "-screen 0 1920x1080x24"); fi
          status=0
          "${wrap[@]}" ../build/sextant_gl_probe 2>&1 | tee gl_probe.txt || status=$?
          {
            echo "### gl_probe — ${{ matrix.name }}"
            echo '```'
            cat gl_probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Kept for the macOS check below, which reads the linker's warnings.
      - name: Build
        id: build
        run: cmake --build build 2>&1 | tee build.txt

      # SEXTANT_MACOS_STATIC_DEPS (v1.0 steps 21.6, 22.6): FreeType and libpng
      # are built from source into libsextant.dylib, so it must depend on
      # nothing outside the SDK -- a copy of it has to run on a Mac that has
      # never seen brew. /usr/lib and /System are the SDK (libz lives there and
      # is meant to be linked from there); @rpath is the library itself. And
      # nothing linked into it may be built for a newer macOS than the one it
      # claims: that is what Homebrew's archives did, and ld only warns.
      - name: libsextant.dylib is self-contained and honours its deployment target (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.build.outcome == 'success' }}
        run: |
          otool -L build/libsextant.dylib | tee otool.txt
          outside=$(awk '/^\t/ { print $1 }' otool.txt \
                    | grep -vE '^(/usr/lib/|/System/|@rpath/)' || true)
          bundled=$(grep -c 'built from source into libsextant.dylib' configure.txt || true)
          minos=$(otool -l build/libsextant.dylib | awk '/LC_BUILD_VERSION/ { f = 1 } f && /minos/ { print $2; exit }')
          # Only the library's own link line: ld prints the output it is
          # linking before its warnings, and tests may link Homebrew's dylibs.
          newer=$(awk '/Linking .* libsextant/ { on = 1; next } /^\[[0-9]+\/[0-9]+\]/ { on = 0 } on' build.txt \
                  | grep -E 'built for newer' || true)
          {
            echo "### libsextant.dylib — ${{ matrix.name }}"
            echo '```'
            grep -E 'built from source into libsextant.dylib' configure.txt || echo "(nothing bundled)"
            echo "minos: ${minos:-?}"
            echo "dylib dependencies outside the SDK:"
            echo "${outside:-(none)}"
            echo "objects built for a newer macOS than minos:"
            echo "${newer:-(none)}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          if [ -n "$outside" ] && [ "$bundled" != 0 ]; then
            echo "FreeType/libpng were bundled and the dylib still depends on:"
            echo "$outside"
            status=1
          fi
          if [ -n "$newer" ]; then
            echo "libsextant.dylib links objects built for a newer macOS than it claims:"
            echo "$newer"
            status=1
          fi
          exit $status

      # --- Tests ------------------------------------------------------------

      # Logs need a login to read, so each test's output is also kept in the
      # artifact and its failures copied to the run summary.

      # stdin from /dev/null: under xvfb basic_smoke sees DISPLAY and calls
      # show(true), whose ENTER prompt must not wait.
      - name: basic_smoke
        # The same guard its two siblings carry: a failure in a step that is not
        # a test — the dylib check above — must not silently skip a test.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          cd out
          wrap=()
          if [ "$RUNNER_OS" = Linux ]; then wrap=(xvfb-run -a -s "-screen 0 1920x1080x24"); fi
          status=0
          "${wrap[@]}" ../build/sextant_smoke < /dev/null 2>&1 | tee basic_smoke.txt || status=$?
          if [ $status -ne 0 ]; then
            {
              echo "### basic_smoke failed (exit $status) — ${{ matrix.name }}"
              echo '```'
              tail -n 40 basic_smoke.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      # The threading design through the public API: figures shown from the main
      # thread and from a worker, the main thread pumping, windows closed out of
      # order. Exit 1 is a failed check, 2 the probe's own 120 s watchdog -- a
      # deadlock. Writes window_probe.png.
      - name: window_probe
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          cd out
          wrap=()
          if [ "$RUNNER_OS" = Linux ]; then wrap=(xvfb-run -a -s "-screen 0 1920x1080x24"); fi
          status=0
          "${wrap[@]}" ../build/sextant_window_probe 2>&1 | tee window_probe.txt || status=$?
          if [ $status -ne 0 ]; then
            {
              echo "### window_probe failed (exit $status) — ${{ matrix.name }}"
              echo '```'
              grep -E 'FAIL|TIMEOUT|GLFW error' window_probe.txt
              tail -n 1 window_probe.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: layout_test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          cd out
          wrap=()
          if [ "$RUNNER_OS" = Linux ]; then wrap=(xvfb-run -a -s "-screen 0 1920x1080x24"); fi
          status=0
          "${wrap[@]}" ../build/sextant_layout_test 2>&1 | tee layout_test.txt || status=$?
          if [ $status -ne 0 ]; then
            {
              echo "### layout_test failed (exit $status) — ${{ matrix.name }}"
              echo '```'
              # Each FAIL under the [section] it belongs to, then the tally.
              awk '/^\[/ { sec = $0 } /FAIL:/ { if (sec != last) { print sec; last = sec } print }' layout_test.txt
              tail -n 1 layout_test.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      # layout_test again with every GL allocation made without data filled
      # with random bytes (SEXTANT_POISON_GL, seeded per run). The checks must
      # still pass and every output must match the run above byte for byte;
      # anything else means sextant read GPU memory it never wrote.
      - name: layout_test, GL allocations poisoned
        if: matrix.poison
        timeout-minutes: 20
        run: |
          mkdir -p out/poisoned
          cd out/poisoned
          status=0
          SEXTANT_POISON_GL=${{ github.run_number }} xvfb-run -a -s "-screen 0 1920x1080x24" \
            ../../build/sextant_layout_test 2>&1 | tee layout_test.txt || status=$?
          problems=()
          grep -q '^poisoned: [1-9]' layout_test.txt || problems+=("the poison never ran")
          for f in *.png *.svg; do
            cmp -s "$f" "../$f" || problems+=("$f differs from the unpoisoned run")
          done
          if [ $status -ne 0 ] || [ ${#problems[@]} -ne 0 ]; then
            {
              echo "### layout_test with poisoned GL allocations failed — ${{ matrix.name }}"
              echo '```'
              awk '/^\[/ { sec = $0 } /FAIL:/ { if (sec != last) { print sec; last = sec } print }' layout_test.txt
              printf '%s\n' "${problems[@]}"
              tail -n 1 layout_test.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outputs-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            out/*.png
            out/*.svg
            out/*.txt
            out/poisoned/layout_test.txt
            configure.txt
            otool.txt
          if-no-files-found: ignore
